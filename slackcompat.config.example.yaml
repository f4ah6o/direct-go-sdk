op:
  binary: "op"

server:
  listen_addr: "127.0.0.1:8091"
  # Optional. When set, Slack-compatible API endpoints require Authorization: Bearer <token>.
  bearer_token_env: "DIRECT_SLACK_COMPAT_TOKEN"
  bearer_token_ref: "op://path/to/slack_compat_token"

slack:
  team_id: "Tdirect"
  team_name: "Direct4B"
  # Optional. If empty, auth.test maps the authenticated Direct user ID.
  bot_user_id: ""
  # Optional. Direct incoming messages are POSTed here as Slack Events API-like JSON.
  event_callback_url: ""

accounts:
  - id: "account-a"
    token_env: "DIRECT_TOKEN_ACCOUNT_A"
    token_ref: "op://path/to/direct_access_token"
    endpoint: "wss://api.direct4b.com/albero-app-server/api"
    proxy_url: ""
