op:
  binary: "op"

bot:
  app_id: "${MICROSOFT_APP_ID}"
  app_password_env: "MICROSOFT_APP_PASSWORD"
  app_password_ref: "op://path/to/app_password"
  endpoint_path: "/api/messages"
  # Incoming Bot Framework JWT validation defaults to the public Bot Connector metadata.
  # Set allow_emulator: true only for Bot Framework Emulator local development.
  allow_emulator: false
  allowed_service_urls: []

teams_channels:
  support: {}
  # Add aliases here while the bridge is running, then bind them in Teams with:
  # @direct bind <alias>
  # trial: {}
  # codex-question: {}
  # codex-answer: {}

codex:
  enabled: false
  binary: "codex"
  cwd: ""
  model: ""
  question_alias: "codex-question"
  answer_alias: "codex-answer"
  allowed_user_ids: []
  base_instructions: |
    You answer Teams questions as a read-only assistant. If the available
    context is enough, answer directly. If a human answer is required, respond
    exactly with "ESCALATE:" followed by the specific question for the human
    responder. Do not modify files or run unsafe actions.

accounts:
  - id: "account-a"
    token_env: "DIRECT_TOKEN_ACCOUNT_A"
    token_ref: "op://path/to/direct_access_token"
    endpoint: "wss://api.direct4b.com/albero-app-server/api"
    proxy_url: ""
    teams_channel: "support"

state:
  # Stores Teams bindings, direct talk/thread mappings, and per-account direct device IDs.
  path: "/state/direct-teams-bridge.json"

server:
  listen_addr: ":8080"
  public_base_url: "https://bridge.example.com"

queues:
  direct_to_teams: 1000
  teams_to_direct: 1000

attachments:
  max_bytes: 26214400
  file_proxy_ttl: "24h"
