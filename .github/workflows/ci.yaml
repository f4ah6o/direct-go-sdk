name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  # Pinned for reproducibility: govulncheck v1.8.0+ requires Go >= 1.26.
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  modules:
    name: Module Inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify every go.mod is listed in .github/ci-modules.json
        run: |
          find . -name go.mod -not -path './vendor/*' -print0 \
            | xargs -0 -n1 dirname | sed 's|^\./||' | sort > /tmp/discovered.txt
          jq -r '.modules[].dir' .github/ci-modules.json | sort > /tmp/listed.txt
          echo "## Modules covered by CI" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' /tmp/listed.txt >> "$GITHUB_STEP_SUMMARY"
          if ! diff -u /tmp/listed.txt /tmp/discovered.txt; then
            echo "::error::Every go.mod directory must be listed in .github/ci-modules.json so CI covers it."
            exit 1
          fi

      - name: Emit module matrix
        id: emit
        run: |
          jq -c '{include: [.modules[] | .dir as $d | .go[] | {dir: $d, go: .}]}' \
            .github/ci-modules.json > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test ${{ matrix.dir }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Compute coverage artifact slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.dir }}' | sed 's|^\.$|root|; s|[/.]|-|g')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ steps.slug.outputs.slug }}-${{ matrix.go }}
          path: ${{ matrix.dir }}/coverage.txt
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: modules
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"  # latest 1.25 patch

      - name: Run go vet (all modules)
        run: |
          while IFS= read -r dir; do
            echo "::group::go vet $dir"
            (cd "$dir" && go vet ./...) || exit 1
            echo "::endgroup::"
          done < <(jq -r '.modules[].dir' .github/ci-modules.json)

      - name: Check formatting (all modules)
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Compile-check README Go snippets
        run: go run ./tools/doccheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: modules
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"  # latest 1.25 patch

      - name: Build all packages and command binaries (all modules)
        run: |
          while IFS= read -r dir; do
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...) || exit 1
            echo "::endgroup::"
          done < <(jq -r '.modules[].dir' .github/ci-modules.json)

  porting-coverage:
    name: Porting Coverage
    runs-on: ubuntu-latest
    needs: modules
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Generate porting coverage reports
        working-directory: ./direct-go
        run: |
          go run ./tools/coverage -format markdown -output COVERAGE.md
          go run ./tools/coverage -format json -output ../coverage-direct-go-porting.json
          go run ./tools/coverage -format badge -output ../.github/badges/direct-go-porting-coverage.json

      - name: Check generated reports are current
        run: git diff --exit-code -- direct-go/COVERAGE.md .github/badges/direct-go-porting-coverage.json

      - name: Add porting coverage summary
        working-directory: ./direct-go
        run: |
          echo "## direct-go Porting Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          go run ./tools/coverage -format text >> "$GITHUB_STEP_SUMMARY"

      - name: Upload porting coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: direct-go-porting-coverage
          path: |
            direct-go/COVERAGE.md
            coverage-direct-go-porting.json
            .github/badges/direct-go-porting-coverage.json
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"  # latest 1.25 patch

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          path: coverage-reports

      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for dir in coverage-reports/*/; do
            name=$(basename "$dir")
            file="$dir/coverage.txt"
            if [ -f "$file" ]; then
              echo "### $name" >> "$GITHUB_STEP_SUMMARY"
              go tool cover -func="$file" | tail -1 >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: modules
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"  # latest 1.25 patch

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck (all modules)
        run: |
          while IFS= read -r dir; do
            echo "::group::govulncheck $dir"
            (cd "$dir" && govulncheck ./...) || exit 1
            echo "::endgroup::"
          done < <(jq -r '.modules[].dir' .github/ci-modules.json)
