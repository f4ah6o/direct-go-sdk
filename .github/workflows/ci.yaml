name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-direct-go:
    name: Test direct-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Install dependencies
        working-directory: ./direct-go
        run: go mod download

      - name: Run tests
        working-directory: ./direct-go
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-direct-go-${{ matrix.go }}
          path: direct-go/coverage.txt
          retention-days: 7

  test-daab-go:
    name: Test daab-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Install dependencies
        working-directory: ./daab-go
        run: go mod download

      - name: Run tests
        working-directory: ./daab-go
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-daab-go-${{ matrix.go }}
          path: daab-go/coverage.txt
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Run go vet (direct-go)
        working-directory: ./direct-go
        run: go vet ./...

      - name: Run go vet (daab-go)
        working-directory: ./daab-go
        run: go vet ./...

      - name: Check formatting (direct-go)
        working-directory: ./direct-go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Check formatting (daab-go)
        working-directory: ./daab-go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

  porting-coverage:
    name: Porting Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Generate porting coverage reports
        working-directory: ./direct-go
        run: |
          go run ./tools/coverage -format markdown -output COVERAGE.md
          go run ./tools/coverage -format json -output ../coverage-direct-go-porting.json
          go run ./tools/coverage -format badge -output ../.github/badges/direct-go-porting-coverage.json

      - name: Check generated reports are current
        run: git diff --exit-code -- direct-go/COVERAGE.md .github/badges/direct-go-porting-coverage.json

      - name: Add porting coverage summary
        working-directory: ./direct-go
        run: |
          echo "## direct-go Porting Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          go run ./tools/coverage -format text >> "$GITHUB_STEP_SUMMARY"

      - name: Upload porting coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: direct-go-porting-coverage
          path: |
            direct-go/COVERAGE.md
            coverage-direct-go-porting.json
            .github/badges/direct-go-porting-coverage.json
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-direct-go, test-daab-go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          path: coverage-reports

      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### direct-go (Go 1.24)" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-reports/coverage-direct-go-1.24/coverage.txt ]; then
            go tool cover -func=coverage-reports/coverage-direct-go-1.24/coverage.txt | tail -1 >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### daab-go (Go 1.24)" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-reports/coverage-daab-go-1.24/coverage.txt ]; then
            go tool cover -func=coverage-reports/coverage-daab-go-1.24/coverage.txt | tail -1 >> $GITHUB_STEP_SUMMARY
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Run govulncheck (direct-go)
        working-directory: ./direct-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run govulncheck (daab-go)
        working-directory: ./daab-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
